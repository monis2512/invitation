services:
  - type: web
    name: shailla-date
    runtime: docker
    plan: free
    repo: https://github.com/monis2512/invitation
    branch: main
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shailla-date-db
          property: connectionString

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: COOKIE_SECURE
        value: "true"

      - key: COOKIE_SAME_SITE
        value: "lax"

databases:
  - name: shailla-date-db
    plan: free
